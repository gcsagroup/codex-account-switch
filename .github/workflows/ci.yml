name: CI

on:
  push:
    branches: ['**', '!codex/signed-macos/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查发布脚本并生成本次版本
        id: meta
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/ci-release.py metadata

  macos:
    needs: prepare
    runs-on: macos-14
    env:
      CI_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 使用统一构建号
        run: python scripts/ci-release.py build-number
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash scripts/package-macos.sh
      - name: 签名并归档 macOS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          MACOS_SIGNING_P12_B64: ${{ secrets.MACOS_SIGNING_P12_B64 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_ALLOW_UNSIGNED: ${{ vars.MACOS_ALLOW_UNSIGNED }}
        run: bash scripts/ci-package-macos.sh
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: package-macos
          path: dist/ci/*
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    env:
      CI_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RUSTFLAGS: -C target-feature=+crt-static
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-static
          cache-on-failure: true
      - name: 使用统一构建号
        run: python scripts/ci-release.py build-number
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Windows 架构、启动与 ZIP 验证
        run: python scripts/ci-release.py windows --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/ci/*
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: 校验双平台来源并生成发布说明
        run: python scripts/ci-release.py assemble --directory release-assets
      - name: 自动发布此提交的测试版
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease \
            --title "$RELEASE_TAG · 自动构建" --notes-file release-assets/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS.txt release-assets/BUILD_INFO.json
          gh release edit "$RELEASE_TAG" --draft=false
